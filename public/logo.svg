<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Researcher BD logo">
  <title>Researcher BD</title>
  <!-- Emerald rounded square background -->
  <rect width="64" height="64" rx="14" fill="#0b6e4f"/>

  <!-- Network node above the book (discovery + connection) -->
  <!-- Central researcher node -->
  <circle cx="32" cy="17" r="4.5" fill="#ffffff"/>
  <!-- Radiating connections -->
  <line x1="32" y1="17" x2="22" y2="26" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="32" y1="17" x2="42" y2="26" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="32" y1="17" x2="32" y2="29" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
  <!-- Connected researcher nodes -->
  <circle cx="22" cy="26" r="2.6" fill="#ffffff"/>
  <circle cx="42" cy="26" r="2.6" fill="#ffffff"/>

  <!-- Open book (knowledge foundation) — two pages meeting at a spine -->
  <path d="M32 34 L14 38 L14 49 L32 45 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M32 34 L50 38 L50 49 L32 45 Z" fill="#ffffff" opacity="0.8"/>
  <!-- Spine highlight -->
  <line x1="32" y1="34" x2="32" y2="45" stroke="#0b6e4f" stroke-width="1.4"/>
  <!-- Page lines (suggesting text/content) -->
  <line x1="19" y1="41" x2="28" y2="39.5" stroke="#0b6e4f" stroke-width="0.9" stroke-linecap="round" opacity="0.5"/>
  <line x1="19" y1="44" x2="28" y2="42.5" stroke="#0b6e4f" stroke-width="0.9" stroke-linecap="round" opacity="0.5"/>
  <line x1="36" y1="39.5" x2="45" y2="41" stroke="#0b6e4f" stroke-width="0.9" stroke-linecap="round" opacity="0.5"/>
  <line x1="36" y1="42.5" x2="45" y2="44" stroke="#0b6e4f" stroke-width="0.9" stroke-linecap="round" opacity="0.5"/>
</svg>
